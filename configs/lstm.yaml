# Baseline architecture (mirrors the original project's LSTM 256 -> LSTM 128
# stack); uses the model's built-in defaults for that shape.
#
# Shares data split, seed, batch size, block size and training-token budget
# with gru.yaml, transformer.yaml and transformer_bpe.yaml so the four runs
# are a fair comparison: steps * batch_size * block_size = 2048 * 64 * 256
# ~= 33.6M tokens, targeting ~10-15 minutes on a 16-thread CPU assuming
# 30-60k tokens/sec for the transformer (RNNs may run slower at the same
# step count; that is expected and fine for the comparison).
name: lstm
data:
  dir: data/processed
tokenizer:
  type: char
model:
  kind: lstm
train:
  steps: 2048
  batch_size: 64
  block_size: 256
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 100
  grad_clip: 1.0
  eval_interval: 256
  eval_batches: 20
  artist_dropout: 0.1
  seed: 1337
  device: cpu
  num_threads: 16
out_dir: runs/lstm
