# Baseline: the original project's LSTM 256 -> LSTM 128 stack, now artist-conditioned.
#
# Shared budget for the architecture comparison (lstm, gru, transformer,
# transformer_bpe): same split, seed, batch size, block size and number of
# training tokens (1500 steps * 32 * 256 = 12.3M tokens). Learning rates are
# common defaults per architecture, not tuned. The four runs were trained at
# the same time on one 16-thread laptop CPU with 4 threads each.
name: lstm
data:
  dir: data/processed
tokenizer:
  type: char
model:
  kind: lstm
train:
  steps: 1500
  batch_size: 32
  block_size: 256
  lr: 0.002
  weight_decay: 0.01
  warmup_steps: 100
  grad_clip: 1.0
  eval_interval: 150
  eval_batches: 40
  artist_dropout: 0.1
  seed: 1337
  device: cpu
  num_threads: 4
out_dir: runs/lstm
