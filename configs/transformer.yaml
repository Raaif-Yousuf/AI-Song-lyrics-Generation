# Small decoder-only transformer on characters.
#
# Shared budget for the architecture comparison (lstm, gru, transformer,
# transformer_bpe): same split, seed, batch size, block size and number of
# training tokens (1500 steps * 32 * 256 = 12.3M tokens). Learning rates are
# common defaults per architecture, not tuned. The four runs were trained at
# the same time on one 16-thread laptop CPU with 4 threads each.
name: transformer
data:
  dir: data/processed
tokenizer:
  type: char
model:
  kind: transformer
  n_layer: 4
  n_head: 4
  d_model: 256
  block_size: 256
  dropout: 0.1
train:
  steps: 1500
  batch_size: 32
  block_size: 256
  lr: 0.001
  weight_decay: 0.01
  warmup_steps: 100
  grad_clip: 1.0
  eval_interval: 150
  eval_batches: 40
  artist_dropout: 0.1
  seed: 1337
  device: cpu
  num_threads: 4
out_dir: runs/transformer
